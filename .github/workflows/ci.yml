name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build-test-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
         submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        working-directory: ./cocktailsRepository/cocktails

        run: npm ci

      - name: Run lint
        run: npm run lint --if-present

      - name: Build application
        working-directory: ./cocktailsRepository/cocktails

        run: npm run build --if-present

      - name: Run tests
        run: npm test --if-present
